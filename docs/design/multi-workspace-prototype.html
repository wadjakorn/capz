<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>capz — Multiple Workspaces + Capture History (prototype)</title>
<style>
/* ============ Graphite tokens — copied from src/app/globals.css ============ */
:root, .dark {
  --bg:#0f0f12; --bg-canvas:#0d0d10; --surface:#161619; --surface-raised:#1f1f24;
  --surface-raised-hover:#26262c; --surface-overlay:#1c1c21;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.12); --border-subtle:rgba(255,255,255,.06);
  --fg:#ecedf0; --fg-2:#c9cad1; --fg-3:#9a9aa3; --fg-4:#71717a;
  --accent:#6d7cff; --accent-hover:#5b6bff; --accent-fg:#fff;
  --accent-soft:rgba(109,124,255,.16); --accent-ring:rgba(109,124,255,.45);
  --success:#34d399; --warning:#fbbf24; --danger:#f76b6b;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-pill:999px;
  --elev-1:0 1px 2px rgba(0,0,0,.40); --elev-2:0 4px 12px rgba(0,0,0,.45); --elev-3:0 12px 32px rgba(0,0,0,.55);
  --shadow-focus:0 0 0 2px var(--bg), 0 0 0 4px var(--accent-ring);
  --text-xs:11px; --text-sm:12px; --text-base:13px; --text-md:14px; --text-lg:16px; --text-xl:20px; --text-2xl:28px;
  --ls-tight:-.022em; --ls-snug:-.015em; --ls-eyebrow:.06em;
  --t-fast:100ms; --t:140ms; --ease:cubic-bezier(.2,.6,.2,1);
}
.light {
  --bg:#f6f6f8; --bg-canvas:#fff; --surface:#fff; --surface-raised:#f0f0f3;
  --surface-raised-hover:#e6e6ea; --surface-overlay:#fff;
  --border:rgba(15,15,18,.10); --border-strong:rgba(15,15,18,.16); --border-subtle:rgba(15,15,18,.06);
  --fg:#18181b; --fg-2:#3f3f46; --fg-3:#6b6b74; --fg-4:#9a9aa3;
  --accent:#5b6bff; --accent-hover:#4a5aff; --accent-soft:rgba(109,124,255,.12); --accent-ring:rgba(109,124,255,.40);
  --success:#059669; --warning:#b45309; --danger:#dc2626;
  --elev-1:0 1px 2px rgba(15,15,18,.08); --elev-2:0 4px 12px rgba(15,15,18,.10); --elev-3:0 12px 32px rgba(15,15,18,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); min-height:100vh;
  font:400 var(--text-base)/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  letter-spacing:-.01em; -webkit-font-smoothing:antialiased;
  display:flex; gap:20px; padding:20px; align-items:flex-start;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.eyebrow{font-size:var(--text-sm);font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--accent)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ============ control rail (NOT part of the product UI) ============ */
#rail{
  position:sticky; top:20px; width:216px; flex:none;
  background:var(--surface); border:1px solid var(--border-strong);
  border-radius:var(--radius-lg); box-shadow:var(--elev-2);
  padding:14px; display:grid; gap:14px; max-height:calc(100vh - 40px); overflow:auto;
}
#rail h1{font-size:var(--text-md);font-weight:600;letter-spacing:var(--ls-snug)}
#rail .sub{font-size:var(--text-xs);color:var(--fg-4);margin-top:2px;line-height:1.35}
.ctl{display:grid;gap:5px}
.ctl > label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-4)}
.seg{display:flex;gap:2px;padding:3px;background:var(--surface-overlay);border:1px solid var(--border);border-radius:var(--radius-md);flex-wrap:wrap}
.seg button{flex:1 1 auto;padding:5px 7px;border-radius:var(--radius-sm);font-size:var(--text-xs);color:var(--fg-3);white-space:nowrap;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.seg button:hover{background:var(--surface-raised);color:var(--fg-2)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
#rail hr{border:0;border-top:1px solid var(--border-subtle)}

/* ============ app shell ============ */
#shellwrap{flex:1;min-width:0;display:grid;gap:10px;justify-items:center}
#shell{
  width:100%; max-width:var(--vw,1180px); height:720px;
  background:var(--bg); border:1px solid var(--border-strong);
  border-radius:var(--radius-lg); box-shadow:var(--elev-3);
  display:flex; flex-direction:column; overflow:hidden; position:relative;
  transition:max-width 200ms var(--ease);
}
#shellcap{font-size:var(--text-xs);color:var(--fg-4)}

/* toolbar */
.tb{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--border);background:var(--surface-overlay);flex:none}
.tb .grp{display:inline-flex;align-items:center;gap:2px}
.tb .sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.tb .spacer{flex:1}
.ico{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--radius-md);color:var(--fg-3);transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.ico:hover{background:var(--surface-raised);color:var(--fg)}
.ico[data-active]{background:var(--accent);color:var(--accent-fg)}
.pillbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;background:var(--surface-raised);border:1px solid var(--border);color:var(--fg-2)}
.pillbtn:hover{background:var(--surface-raised-hover);color:var(--fg)}
.pillbtn.primary{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.pillbtn.primary:hover{background:var(--accent-hover)}
.newws{animation:none}
.newws.flash{animation:flash 500ms var(--ease) 1}
@keyframes flash{0%,100%{box-shadow:none}40%{box-shadow:0 0 0 3px var(--accent-ring)}}

/* main row */
.mainrow{position:relative;display:flex;min-height:0;flex:1;overflow:hidden;background:var(--bg-canvas)}
.canvascol{position:relative;min-width:0;flex:1;overflow:hidden}
#canvasInner{position:absolute;inset:0;display:grid;place-items:center;padding:18px}
.shot{border-radius:var(--radius-md);box-shadow:var(--elev-2);max-width:88%;max-height:88%}
.emptycanvas{display:grid;gap:12px;justify-items:center;text-align:center;padding:32px 40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--elev-1)}
.emptycanvas .k{width:56px;height:56px;border-radius:var(--radius-lg);background:var(--surface-raised);display:grid;place-items:center;font-size:20px;color:var(--fg-3)}
.emptycanvas p{font-size:var(--text-base);color:var(--fg-2);max-width:230px}

/* drop overlay */
#drop{position:absolute;inset:0;z-index:14;display:none;place-items:center;background:var(--accent-soft);backdrop-filter:blur(1px)}
#drop.on{display:grid}
#drop::before{content:"";position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:var(--radius-lg)}
#drop .pill{position:relative;display:inline-flex;align-items:center;gap:9px;padding:11px 18px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-pill);box-shadow:var(--elev-3);font-size:var(--text-md);font-weight:500}

/* sidebar */
.side{width:240px;flex:none;height:100%;display:flex;flex-direction:column;gap:16px;overflow-y:auto;border-left:1px solid var(--border);background:var(--surface-overlay);padding:12px}
.sect{display:flex;flex-direction:column;gap:4px}
.sect > h3{padding:0 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-2);opacity:.6;display:flex;align-items:center;gap:6px}
.sect > h3 .n{margin-left:auto;font-size:10px;color:var(--fg-4);letter-spacing:0}
.row{display:flex;width:100%;align-items:center;gap:8px;border-radius:var(--radius-md);padding:6px 8px;text-align:left;font-size:var(--text-xs);color:var(--fg-2);transition:background var(--t-fast) var(--ease)}
.row:hover{background:var(--surface-raised)}
.row[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.side .divider{height:1px;background:var(--border-subtle);margin:2px 0}
.swatches{display:flex;gap:6px;padding:2px 8px;flex-wrap:wrap}
.sw{width:20px;height:20px;border-radius:var(--radius-sm);border:1px solid var(--border-strong)}
.sw[data-on]{box-shadow:0 0 0 2px var(--surface-overlay),0 0 0 3px var(--accent)}
.slider{height:4px;border-radius:2px;background:var(--surface-raised);margin:8px;position:relative}
.slider::after{content:"";position:absolute;left:38%;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--fg-2)}

/* ---- history ---- */
.hhead{display:flex;align-items:center;gap:6px;padding:0 8px 2px}
.hhead .t{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-2);opacity:.6}
.hhead .n{font-size:10px;color:var(--fg-4)}
.hhead .sp{flex:1}
.miniseg{display:inline-flex;gap:1px;padding:2px;background:var(--surface-raised);border-radius:var(--radius-sm)}
.miniseg button{width:20px;height:18px;display:grid;place-items:center;border-radius:4px;color:var(--fg-3)}
.miniseg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.hlist{max-height:270px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding-right:2px}
.hgroup{font-size:10px;color:var(--fg-4);padding:8px 8px 3px}
.hrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:var(--radius-sm);cursor:grab;position:relative;transition:background var(--t-fast) var(--ease)}
.hrow:hover{background:var(--surface-raised)}
.hrow[data-sel]{background:var(--accent-soft)}
.hrow[data-sel]::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;border-radius:2px;background:var(--accent)}
.hthumb{width:40px;height:26px;flex:none;border-radius:4px;overflow:hidden;background:var(--bg-canvas);border:1px solid var(--border)}
.hthumb svg{width:100%;height:100%}
.hmeta{min-width:0;flex:1}
.hname{font-size:var(--text-xs);color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:10px;color:var(--fg-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow[data-missing] .hthumb{opacity:.35}
.hrow[data-missing] .hname{text-decoration:line-through;color:var(--fg-4)}
.warn{color:var(--warning);flex:none}
.hact{display:flex;gap:2px;padding:3px 6px 6px 54px}
.hact button{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:var(--radius-sm);font-size:10px;color:var(--fg-2);background:var(--surface-raised)}
.hact button:hover{background:var(--surface-raised-hover);color:var(--fg)}
.hact button.danger:hover{background:var(--danger);color:#fff}
.hact .sp{flex:1}
.hempty{display:grid;gap:4px;justify-items:center;text-align:center;padding:22px 12px;color:var(--fg-4)}
.hempty .a{font-size:var(--text-xs);color:var(--fg-3)}
.hempty .b{font-size:10px}
/* grid mode */
.hgrid{max-height:270px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px}
.gtile{position:relative;aspect-ratio:108/68;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);background:var(--bg-canvas);cursor:grab}
.gtile svg{width:100%;height:100%}
.gtile:hover{border-color:var(--border-strong)}
.gtile[data-sel]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gtile .time{position:absolute;right:3px;bottom:3px;font-size:9px;padding:1px 4px;border-radius:3px;background:rgba(0,0,0,.55);color:#fff}
.gtile[data-missing]{opacity:.4}
.gtile .gwarn{position:absolute;right:3px;top:3px;color:var(--warning)}
.gscrim{position:absolute;left:0;right:0;bottom:0;display:flex;gap:2px;justify-content:center;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.gscrim button{width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:#e8e8ec;background:rgba(255,255,255,.10)}
.gscrim button:hover{background:rgba(255,255,255,.22)}
.gscrim button.danger:hover{background:var(--danger)}

/* ============ workspace bar ============ */
#wsbar{
  flex:none; display:flex; align-items:center; gap:8px;
  border-top:1px solid var(--border); background:var(--surface-overlay);
  overflow:hidden; transition:height 160ms var(--ease), padding 160ms var(--ease);
}
#wsbar[data-mode=hidden]{height:0;padding:0;border-top-color:transparent}
#wsbar[data-mode=full]{height:84px;padding:8px 10px}
#wsbar[data-mode=rail]{height:30px;padding:0 10px}
.wstrip{display:flex;align-items:center;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.wstrip::-webkit-scrollbar{display:none}
.wsctl{display:flex;align-items:center;gap:2px;flex:none;padding-left:8px;border-left:1px solid var(--border)}
.wscount{font-size:10px;color:var(--fg-4);margin-right:4px;white-space:nowrap}
.chev{width:24px;height:24px;display:grid;place-items:center;border-radius:var(--radius-sm);color:var(--fg-3)}
.chev:hover{background:var(--surface-raised);color:var(--fg)}

/* tiles (full mode) */
.tilewrap{flex:none;display:grid;gap:2px;justify-items:center}
.tile{position:relative;width:100px;height:62px;border-radius:var(--radius-md);overflow:hidden;background:var(--bg-canvas);
  border:1px solid var(--border);opacity:.62;transition:opacity var(--t) var(--ease),transform var(--t) var(--ease),border-color var(--t) var(--ease)}
.tile svg{width:100%;height:100%}
.tilewrap:hover .tile{opacity:1;border-color:var(--border-strong)}
.tile[data-active]{opacity:1;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);transform:translateY(-2px)}
.badge{position:absolute;left:4px;top:4px;min-width:16px;height:16px;padding:0 4px;border-radius:4px;font-size:10px;font-weight:600;
  display:grid;place-items:center;background:var(--surface-raised);color:var(--fg-3)}
.tile[data-active] .badge{background:var(--accent);color:var(--accent-fg)}
.dot{position:absolute;right:5px;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.x{position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:4px;display:none;place-items:center;background:rgba(0,0,0,.62);color:#fff}
.tilewrap:hover .x{display:grid}
.x:hover{background:var(--danger)}
.cap{font-size:10px;color:var(--fg-4);opacity:0;transition:opacity var(--t) var(--ease);white-space:nowrap}
.tilewrap:hover .cap, .tilewrap[data-active] .cap{opacity:1}
.tile.empty{display:grid;place-items:center;border-style:dashed;color:var(--fg-4)}
.tile.empty .lbl{font-size:9px;margin-top:3px}
.newtile{flex:none;width:100px;height:62px;border-radius:var(--radius-md);border:1px dashed var(--border-strong);
  display:grid;place-items:center;gap:2px;color:var(--fg-3);align-content:center;transition:background var(--t-fast) var(--ease)}
.newtile:hover:not(:disabled){background:var(--surface-raised);color:var(--fg-2)}
.newtile:disabled{opacity:.4;cursor:not-allowed}
.newtile .lbl{font-size:10px}

/* pills (rail mode) */
.pill{flex:none;min-width:22px;height:18px;padding:0 6px;border-radius:var(--radius-sm);font-size:10px;font-weight:600;
  display:grid;place-items:center;background:var(--surface-raised);color:var(--fg-3)}
.pill:hover{background:var(--surface-raised-hover);color:var(--fg-2)}
.pill[data-active]{background:var(--accent);color:var(--accent-fg)}
.pill.pulse{animation:pulse 500ms var(--ease) 1}
@keyframes pulse{0%,100%{box-shadow:none}45%{box-shadow:0 0 0 3px var(--accent-soft)}}

/* phone tweaks */
#shell[data-w="400"] .side{position:absolute;right:0;top:0;z-index:12;height:100%;box-shadow:var(--elev-3)}
#shell[data-w="400"] #wsbar[data-mode=full]{height:62px}
#shell[data-w="400"] .tile,#shell[data-w="400"] .newtile{width:72px;height:46px}
#shell[data-w="400"] .cap{display:none}

/* web banner */
#webnote{display:none;align-items:center;gap:8px;padding:6px 12px;font-size:var(--text-xs);color:var(--fg-2);
  background:var(--accent-soft);border-bottom:1px solid var(--border);flex:none}
#shell[data-shell=web] #webnote{display:flex}

/* ============ modal ============ */
#scrim{position:absolute;inset:0;z-index:40;display:none;place-items:center;background:rgba(0,0,0,.55);padding:20px}
#scrim.on{display:grid}
.modal{width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--elev-3);padding:20px;display:grid;gap:14px}
.modal .hd{display:flex;align-items:flex-start;gap:10px}
.modal h2{font-size:var(--text-lg);font-weight:600;letter-spacing:var(--ls-snug)}
.modal .obj{display:flex;align-items:center;gap:10px}
.modal .obj .th{width:88px;height:55px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);background:var(--bg-canvas);flex:none}
.modal .obj .th svg{width:100%;height:100%}
.modal .obj .l1{font-size:var(--text-sm);color:var(--fg-2)}
.modal .obj .l2{font-size:var(--text-xs);color:var(--fg-4);margin-top:2px}
.modal p{font-size:var(--text-base);color:var(--fg-2);line-height:1.5}
.modal .ft{display:flex;justify-content:flex-end;gap:8px}
.mbtn{height:34px;padding:0 15px;border-radius:var(--radius-md);font-size:var(--text-md);font-weight:500;border:1px solid transparent}
.mbtn.ghost{color:var(--fg-2)} .mbtn.ghost:hover{background:var(--surface-raised);color:var(--fg)}
.mbtn.danger{background:var(--danger);color:#fff} .mbtn.danger:hover{filter:brightness(1.06)}

/* toast */
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;z-index:30;display:none;align-items:center;gap:12px;
  padding:9px 12px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-md);box-shadow:var(--elev-3);font-size:var(--text-sm)}
#toast.on{display:flex}
#toast button{font-size:var(--text-sm);font-weight:600;color:var(--accent)}

/* drag ghost */
#ghost{position:fixed;z-index:99;pointer-events:none;display:none;width:96px;height:60px;border-radius:var(--radius-md);
  overflow:hidden;border:1px solid var(--accent);box-shadow:var(--elev-3);opacity:.9;background:var(--bg-canvas)}
#ghost svg{width:100%;height:100%}

@media (max-width:860px){
  body{flex-direction:column;padding:12px}
  #rail{position:static;width:100%}
  #shell{height:600px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}
</style>
</head>
<body>

<!-- ===================== CONTROL RAIL (not product UI) ===================== -->
<aside id="rail">
  <div>
    <h1>Prototype controls</h1>
    <div class="sub">Not part of the app. Flip states to review the design.</div>
  </div>

  <div class="ctl"><label>Shell</label><div class="seg" data-ctl="shell">
    <button data-v="desktop" aria-pressed="true">Desktop</button>
    <button data-v="web">Web /paste</button>
  </div></div>

  <div class="ctl"><label>Viewport</label><div class="seg" data-ctl="vw">
    <button data-v="1180" aria-pressed="true">1440</button>
    <button data-v="900">900</button>
    <button data-v="400">400</button>
  </div></div>

  <hr>

  <div class="ctl"><label>Workspaces</label><div class="seg" data-ctl="ws">
    <button data-v="off" aria-pressed="true">Off</button>
    <button data-v="1">1</button>
    <button data-v="3">3</button>
    <button data-v="5">5 full</button>
  </div></div>

  <div class="ctl"><label>Bottom bar</label><div class="seg" data-ctl="bar">
    <button data-v="full" aria-pressed="true">Expanded</button>
    <button data-v="rail">Collapsed</button>
  </div></div>

  <hr>

  <div class="ctl"><label>Sidebar</label><div class="seg" data-ctl="side">
    <button data-v="global" aria-pressed="true">No tool</button>
    <button data-v="tool">Tool selected</button>
  </div></div>

  <div class="ctl"><label>Capture history</label><div class="seg" data-ctl="hist">
    <button data-v="off">Off</button>
    <button data-v="empty">Empty</button>
    <button data-v="12" aria-pressed="true">12 items</button>
    <button data-v="full">50 / full</button>
    <button data-v="missing">1 missing</button>
  </div></div>

  <div class="ctl"><label>History view</label><div class="seg" data-ctl="hview">
    <button data-v="list" aria-pressed="true">List</button>
    <button data-v="grid">Thumbnails</button>
  </div></div>

  <hr>

  <div class="ctl"><label>Canvas</label><div class="seg" data-ctl="canvas">
    <button data-v="image" aria-pressed="true">Has image</button>
    <button data-v="empty">Empty</button>
  </div></div>

  <div class="ctl"><label>Modals</label><div class="seg" data-ctl="modal">
    <button data-v="closews">Close ws</button>
    <button data-v="trash">Move to Trash</button>

    <div class="tb">

        New workspace

        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>

    <div id="webnote">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>

<div id="ghost"></div>

<script>
/* ================= fake screenshot art (no external assets) ================= */
const PAL = [
  ["#1e2a4a","#2f4f8f","#4a7fd4"], ["#2c1f3d","#5b3d7a","#9b6fd4"],
  ["#12312c","#1f6b5a","#39b18f"], ["#3a2416","#7a4a24","#d08a44"],
  ["#38182a","#7a2a4a","#d45a86"], ["#1a2430","#33475e","#6f93bd"],
];
function shot(i, opts = {}) {
  const p = PAL[i % PAL.length], W = 320, H = 200;
  const ann = opts.ann || 0;
  let a = "";
  if (ann > 0) a += `<rect x="196" y="42" width="96" height="52" rx="4" fill="none" stroke="#f76b6b" stroke-width="4"/>`;
  if (ann > 1) a += `<path d="M60 158 L168 104" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/><path d="M168 104 l-20 2 l8 -16 z" fill="#fbbf24"/>`;
  if (ann > 2) a += `<circle cx="72" cy="60" r="17" fill="#6d7cff"/><text x="72" y="67" font-size="19" font-weight="700" text-anchor="middle" fill="#fff" font-family="system-ui">1</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#g${i})"/>
    <rect x="0" y="0" width="${W}" height="22" fill="rgba(0,0,0,.28)"/>
    <circle cx="14" cy="11" r="4" fill="#f76b6b"/><circle cx="28" cy="11" r="4" fill="#fbbf24"/><circle cx="42" cy="11" r="4" fill="#34d399"/>
    <rect x="18" y="42" width="108" height="9" rx="4.5" fill="rgba(255,255,255,.30)"/>
    <rect x="18" y="60" width="152" height="7" rx="3.5" fill="rgba(255,255,255,.17)"/>
    <rect x="18" y="74" width="128" height="7" rx="3.5" fill="rgba(255,255,255,.17)"/>
    <rect x="18" y="98" width="172" height="7" rx="3.5" fill="rgba(255,255,255,.13)"/>
    <rect x="18" y="112" width="96" height="7" rx="3.5" fill="rgba(255,255,255,.13)"/>
    <rect x="196" y="42" width="108" height="76" rx="7" fill="${p[2]}" opacity=".5"/>
    <rect x="18" y="140" width="286" height="44" rx="7" fill="rgba(255,255,255,.08)"/>
    ${a}</svg>`;
}
const ICONS = {
  reveal:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  copy:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  trash:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>',
  warn:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>',
  list:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
  grid:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>',
  down:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  up:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
  plus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>',
  imgoff:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 17 5-5 4 4 2-2 5 5M3 3l18 18"/></svg>',
  layer:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>',
  image:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 5-5 4 4 2.5-2.5L20 18"/></svg>',
};

/* ================= state ================= */
const S = {
  shell:"desktop", vw:"1180", ws:"off", bar:"full", side:"global",
  hist:"12", hview:"list", canvas:"image", theme:"dark",
  active:0, selHist:null, barUserSet:false,
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const WS_SEED = [
  { kind:"Area",   ago:"2m",  ann:3 },
  { kind:"Window", ago:"6m",  ann:0 },
  { kind:"Full",   ago:"14m", ann:2 },
  { kind:"Area",   ago:"31m", ann:1 },
  { kind:"Scroll", ago:"1h",  ann:0 },
];
function wsCount(){ return S.ws === "off" ? 0 : parseInt(S.ws, 10); }
function wsMax(){ return S.shell === "web" ? 3 : 5; }

const HIST = [
  { n:"capz-20260911-143205.png", t:"14:32", sz:"1.2 MB", dim:"2560×1440", d:"Today" },
  { n:"capz-20260911-140812.png", t:"14:08", sz:"840 KB", dim:"1728×1080", d:"Today" },
  { n:"capz-20260911-132044.png", t:"13:20", sz:"2.1 MB", dim:"3024×1890", d:"Today" },
  { n:"capz-20260911-115530.png", t:"11:55", sz:"612 KB", dim:"1200×800",  d:"Today" },
  { n:"capz-20260911-094417.png", t:"09:44", sz:"1.6 MB", dim:"2560×1600", d:"Today" },
  { n:"capz-20260910-220117.png", t:"22:01", sz:"940 KB", dim:"1920×1200", d:"Yesterday" },
  { n:"capz-20260910-181233.png", t:"18:12", sz:"1.1 MB", dim:"2048×1280", d:"Yesterday" },
  { n:"capz-20260910-160905.png", t:"16:09", sz:"760 KB", dim:"1440×900",  d:"Yesterday" },
  { n:"capz-20260909-141850.png", t:"14:18", sz:"1.4 MB", dim:"2560×1440", d:"9 Sep" },
  { n:"capz-20260909-101122.png", t:"10:11", sz:"520 KB", dim:"1280×800",  d:"9 Sep" },
  { n:"capz-20260908-193040.png", t:"19:30", sz:"1.9 MB", dim:"2880×1800", d:"8 Sep" },
  { n:"capz-20260908-084515.png", t:"08:45", sz:"680 KB", dim:"1600×1000", d:"8 Sep" },
];
function histItems(){
  if (S.hist === "off" || S.hist === "empty") return [];
  const base = HIST.map((h, i) => ({ ...h, i, missing:false }));
  if (S.hist === "missing") { base[5] = { ...base[5], missing:true }; }
  return base;
}
function histTotal(){ return S.hist === "full" ? 50 : histItems().length; }

/* ================= renderers ================= */
function renderCanvas(){
  const el = $("#canvasInner");
  if (S.canvas === "empty") {
    el.innerHTML = `<div class="emptycanvas"><div class="k">⌘</div>
      <p>Paste an image (<span class="mono" style="color:var(--fg)">⌘V</span>) or capture from the tray.</p></div>`;
  } else {
    const w = wsCount() ? WS_SEED[S.active] : WS_SEED[0];
    el.innerHTML = `<div class="shot" style="width:min(100%,660px);aspect-ratio:320/200;overflow:hidden;border-radius:var(--radius-md)">${shot(S.active, {ann:w.ann})}</div>`;
  }
}

function toolPanel(){
  return `
  <div class="sect"><h3>Rectangle</h3>
    <div class="swatches">${["#f76b6b","#fbbf24","#34d399","#6d7cff","#ecedf0"].map((c,i)=>
      `<span class="sw" style="background:${c}" ${i===0?"data-on":""}></span>`).join("")}</div>
    <div class="divider"></div>
    <h3 style="margin-top:6px">Stroke width</h3><div class="slider"></div>
    <h3 style="margin-top:6px">Corner radius</h3><div class="slider"></div>
  </div>
  <div class="sect"><h3>Arrange</h3>
    <button class="row">Bring to front</button>
    <button class="row">Send to back</button>
  </div>
  <div style="padding:10px 8px;font-size:10px;color:var(--fg-4);line-height:1.5">
    Capture history is hidden while a tool has options — it only appears in the global panel.
  </div>`;
}

function historySection(){
  if (S.hist === "off") return "";
  if (S.shell === "web") return "";
  const items = histItems();
  const head = `<div class="hhead">
      <span class="t">History</span><span class="n">${histTotal()}${S.hist==="full"?" / 50":""}</span>
      <span class="sp"></span>
      <span class="miniseg" role="group" aria-label="History view">
        <button data-hview="list" aria-pressed="${S.hview==="list"}" title="List">${ICONS.list}</button>
        <button data-hview="grid" aria-pressed="${S.hview==="grid"}" title="Thumbnails">${ICONS.grid}</button>
      </span>
      <button class="chev" style="width:20px;height:18px" title="More"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </div>`;
  if (!items.length) {
    return `<div class="sect">${head}
      <div class="hempty"><div class="a">No saved files yet</div><div class="b">Files you export land here.</div></div></div>`;
  }
  const acts = (it) => it.missing
    ? `<div class="hact"><button class="danger">${ICONS.trash} Remove from list</button></div>`
    : `<div class="hact">
         <button>${ICONS.reveal} Reveal</button>
         <button>${ICONS.copy} Copy</button>
         <span class="sp"></span>
         <button class="danger" data-modal="trash" title="Move to Trash">${ICONS.trash}</button>
       </div>`;

  if (S.hview === "grid") {
    const tiles = items.map(it => `
      <div class="gtile" data-hi="${it.i}" ${S.selHist===it.i?"data-sel":""} ${it.missing?"data-missing":""} title="${esc(it.n)}">
        ${shot(it.i + 1)}
        ${it.missing?`<span class="gwarn">${ICONS.warn}</span>`:`<span class="time">${it.t}</span>`}
        ${S.selHist===it.i?`<div class="gscrim">${it.missing
          ? `<button class="danger" title="Remove from list">${ICONS.trash}</button>`
          : `<button title="Reveal">${ICONS.reveal}</button><button title="Copy">${ICONS.copy}</button><button class="danger" data-modal="trash" title="Move to Trash">${ICONS.trash}</button>`}</div>`:""}
      </div>`).join("");
    return `<div class="sect">${head}<div class="hgrid">${tiles}</div></div>`;
  }

  let out = "", lastDay = "";
  items.forEach(it => {
    if (items.length > 8 && it.d !== lastDay) { out += `<div class="hgroup">${it.d}</div>`; lastDay = it.d; }
    out += `<div class="hrow" data-hi="${it.i}" ${S.selHist===it.i?"data-sel":""} ${it.missing?"data-missing":""}>
      <span class="hthumb">${shot(it.i + 1)}</span>
      <span class="hmeta"><span class="hname">${esc(it.n)}</span>
        <span class="hsub">${it.missing ? `${it.d} · File not found` : `${it.t} · ${it.sz} · ${it.dim}`}</span></span>
      ${it.missing ? `<span class="warn">${ICONS.warn}</span>` : ""}
    </div>`;
    if (S.selHist === it.i) out += acts(it);
  });
  return `<div class="sect">${head}<div class="hlist">${out}</div></div>`;
}

function globalPanel(){
  const hasImg = S.canvas === "image";
  return `
  <div class="sect"><h3>View</h3>
    <button class="row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg> Zoom &nbsp;<span style="margin-left:auto;color:var(--fg-4)">Fit</span></button>
    <button class="row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18v5H3zM7 6v3M11 6v3M15 6v3M19 6v3"/></svg> Rulers</button>
  </div>
  <div class="sect"><h3>Workspace</h3>
    <button class="row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m4 17 5-5 4 4 2.5-2.5L20 18"/></svg> ${hasImg?"Add image as overlay":"Open image file"}</button>
    <button class="row">${ICONS.trash} ${hasImg?"Clear workspace":"Workspace already empty"}</button>
  </div>
  <div class="sect"><h3>Text</h3>
    <button class="row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg> Detect text</button>
  </div>
  ${hasImg ? `<div class="sect"><h3>Backdrop</h3>
    <div class="swatches">${["linear-gradient(135deg,#6d7cff,#c06de0)","linear-gradient(135deg,#34d399,#0ea5e9)","linear-gradient(135deg,#fbbf24,#f76b6b)","#1f1f24"].map((g,i)=>
      `<span class="sw" style="background:${g}" ${i===0?"data-on":""}></span>`).join("")}</div>
    <h3 style="margin-top:8px">Padding</h3><div class="slider"></div></div>` : ""}
  ${historySection()}`;
}

function renderSide(){
  $("#side").innerHTML = S.side === "tool" ? toolPanel() : globalPanel();
}

/* ================= workspace bar ================= */
function barMode(){
  const n = wsCount();
  if (n <= 1) return "hidden";
  return S.bar === "rail" ? "rail" : "full";
}
function renderBar(){
  const bar = $("#wsbar"), strip = $("#wstrip"), mode = barMode(), n = wsCount(), max = wsMax();
  bar.dataset.mode = mode;
  $("#wscount").textContent = mode === "hidden" ? "" : `${n}/${max}`;
  $("#btnChev").innerHTML = mode === "rail" ? ICONS.up : ICONS.down;
  $("#btnChev").setAttribute("aria-expanded", String(mode !== "rail"));
  $("#btnChev").title = mode === "rail" ? "Expand workspace bar" : "Collapse workspace bar";
  if (mode === "hidden") { strip.innerHTML = ""; return; }

  if (mode === "rail") {
    strip.innerHTML = Array.from({length:n}, (_, i) =>
      `<button class="pill" role="tab" aria-selected="${i===S.active}" ${i===S.active?"data-active":""}
        data-go="${i}" title="${WS_SEED[i].kind} · ${WS_SEED[i].ago}">${i+1}</button>`).join("") +
      `<button class="pill" data-new title="New workspace" ${n>=max?"disabled":""} style="opacity:${n>=max?.4:1}">+</button>`;
    return;
  }
  strip.innerHTML = Array.from({length:n}, (_, i) => {
    const w = WS_SEED[i], on = i === S.active;
    return `<div class="tilewrap" ${on?"data-active":""}>
      <div class="tile" role="tab" aria-selected="${on}" ${on?"data-active":""} data-go="${i}">
        ${shot(i, {ann:w.ann})}
        <span class="badge">${i+1}</span>
        ${w.ann?'<span class="dot"></span>':""}
        <button class="x" data-modal="closews" data-wsi="${i}" title="Close workspace ${i+1}">${ICONS.x}</button>
      </div>
      <span class="cap">${w.kind} · ${w.ago}</span>
    </div>`;
  }).join("") +
  `<button class="newtile" data-new ${n>=max?"disabled":""} title="${n>=max?`Maximum ${max} workspaces — close one first`:"New workspace (⌘⇧N)"}">
     ${ICONS.plus}<span class="lbl">New</span></button>`;
}

/* ================= modals ================= */
const MODALS = {
  closews: (i=2) => ({
    icon:"warn", title:`Close workspace ${i+1}?`,
    obj:{ art: shot(i, {ann:WS_SEED[i].ann}), l1:`${WS_SEED[i].ann} annotations${WS_SEED[i].ann?" · cropped":""}`, l2:`Captured ${WS_SEED[i].ago} ago` },
    body:"The edits in this workspace will be discarded. The screenshot file is not saved anywhere else.",
    ok:"Close", danger:true,
  }),
  trash: () => ({
    icon:"warn", title:"Move to Trash?",
    obj:{ art: shot(2), l1:"capz-20260911-140812.png", l2:"~/Pictures/capz · 840 KB" },
    body:"You can restore it from the Trash. It will also be removed from this list.",
    ok:"Move to Trash", danger:true,
  }),
  turnoff: () => ({
    icon:"warn", title:"Turn off multiple workspaces?",
    obj:null,
    body:`${Math.max(wsCount()-1,0)} workspaces will be closed and their edits discarded. Workspace ${S.active+1} (the one you're editing) is kept.`,
    ok:"Turn off", danger:true,
  }),
};
function openModal(kind, i){
  const m = MODALS[kind](i);
  $("#modal").innerHTML = `
    <div class="hd"><span style="color:var(--warning);margin-top:2px">${ICONS.warn}</span><h2>${esc(m.title)}</h2></div>
    ${m.obj ? `<div class="obj"><span class="th">${m.obj.art}</span>
       <span><span class="l1">${esc(m.obj.l1)}</span><span class="l2">${esc(m.obj.l2)}</span></span></div>` : ""}
    <p>${esc(m.body)}</p>
    <div class="ft"><button class="mbtn ghost" data-close autofocus>Cancel</button>
      <button class="mbtn ${m.danger?"danger":""}" data-close>${esc(m.ok)}</button></div>`;
  $("#scrim").classList.add("on");
  $("#modal").querySelector("[autofocus]")?.focus();
}
function closeModal(){ $("#scrim").classList.remove("on"); }

let toastT;
function showToast(text, undo = true){
  $("#toastText").textContent = text;
  $("#toastUndo").style.display = undo ? "" : "none";
  $("#toast").classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => $("#toast").classList.remove("on"), 6000);
}

/* ================= main render ================= */
function render(){
  const sh = $("#shell");
  document.documentElement.className = S.theme;
  sh.dataset.shell = S.shell; sh.dataset.w = S.vw;
  sh.style.setProperty("--vw", S.vw === "1180" ? "1180px" : S.vw + "px");
  $("#capw").textContent = S.vw === "1180" ? "1440" : S.vw;
  $("#btnNewWs").style.display = S.ws === "off" ? "none" : "";
  if (S.active >= Math.max(wsCount(), 1)) S.active = 0;
  renderCanvas(); renderSide(); renderBar();
}

/* ================= wiring ================= */
document.querySelectorAll("#rail .seg").forEach(seg => {
  seg.addEventListener("click", e => {
    const b = e.target.closest("button[data-v]"); if (!b) return;
    const key = seg.dataset.ctl, v = b.dataset.v;
    if (key === "modal") { openModal(v, S.active); return; }
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    S[key] = v;
    if (key === "vw" && v === "400") { S.bar = "rail"; syncSeg("bar","rail"); }
    if (key === "shell" && v === "web" && S.ws === "off") { S.ws = "3"; syncSeg("ws","3"); }
    if (key === "ws" && v !== "off" && S.canvas === "empty") { S.canvas = "image"; syncSeg("canvas","image"); }
    if (key === "hist") S.selHist = null;
    render();
  });
});
function syncSeg(ctl, v){
  document.querySelectorAll(`#rail .seg[data-ctl="${ctl}"] button`)
    .forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === v)));
}

$("#shell").addEventListener("click", e => {
  const modal = e.target.closest("[data-modal]");
  if (modal) { e.stopPropagation(); openModal(modal.dataset.modal, +(modal.dataset.wsi ?? S.active)); return; }
  const go = e.target.closest("[data-go]");
  if (go) { S.active = +go.dataset.go; render(); return; }
  if (e.target.closest("[data-new]") && !e.target.closest("[data-new]").disabled) { addWs(); return; }
  const hv = e.target.closest("[data-hview]");
  if (hv) { S.hview = hv.dataset.hview; syncSeg("hview", S.hview); render(); return; }
  const hi = e.target.closest("[data-hi]");
  if (hi) { const i = +hi.dataset.hi; S.selHist = S.selHist === i ? null : i; render(); return; }
});
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim" || e.target.closest("[data-close]")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

$("#btnChev").addEventListener("click", () => {
  S.bar = barMode() === "rail" ? "full" : "rail"; S.barUserSet = true; syncSeg("bar", S.bar); render();
});
$("#wsbar").addEventListener("dblclick", e => {
  if (e.target.closest("[data-go],[data-new],.wsctl")) return;
  S.bar = barMode() === "rail" ? "full" : "rail"; S.barUserSet = true; syncSeg("bar", S.bar); render();
});
$("#btnMore").addEventListener("click", () => showToast("Menu: Close others · Close all · Reopen last closed", false));
$("#toastUndo").addEventListener("click", () => $("#toast").classList.remove("on"));
$("#btnNewWs").addEventListener("click", addWs);

function addWs(){
  const n = wsCount(), max = wsMax();
  if (n >= max) {
    showToast(`Workspace 1 closed to make room`);
    S.active = max - 1;
  } else {
    S.ws = String(n + 1); syncSeg("ws", S.ws); S.active = n;
    $("#btnNewWs").classList.add("flash");
    setTimeout(() => $("#btnNewWs").classList.remove("flash"), 520);
  }
  render();
  if (barMode() === "rail") {
    const pills = $("#wstrip").querySelectorAll(".pill");
    pills[S.active]?.classList.add("pulse");
  }
}

/* ================= pointer-based drag: history row → canvas ================= */
let drag = null;
$("#side").addEventListener("pointerdown", e => {
  const src = e.target.closest("[data-hi]");
  if (!src || e.target.closest(".hact, .gscrim")) return;
  drag = { i:+src.dataset.hi, x0:e.clientX, y0:e.clientY, live:false, id:e.pointerId };
  src.setPointerCapture(e.pointerId);
  src.addEventListener("pointermove", onMove);
  src.addEventListener("pointerup", onUp, { once:true });
  src.addEventListener("pointercancel", onUp, { once:true });
});
function onMove(e){
  if (!drag) return;
  if (!drag.live) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 4) return;
    drag.live = true;
    const g = $("#ghost");
    g.innerHTML = shot(drag.i + 1); g.style.display = "block";
    const empty = S.canvas === "empty";
    $("#dropIcon").innerHTML = empty ? ICONS.image : ICONS.layer;
    $("#dropText").textContent = empty ? "Drop to open as the main image" : "Drop to add as a layer";
    $("#drop").classList.add("on");
  }
  const g = $("#ghost");
  g.style.left = (e.clientX - 48) + "px";
  g.style.top  = (e.clientY - 30) + "px";
}
function onUp(e){
  const g = $("#ghost");
  if (drag?.live) {
    const r = $("#canvasCol").getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    const it = histItems().find(x => x.i === drag.i);
    if (inside) {
      if (it?.missing) showToast("File no longer exists", false);
      else if (S.canvas === "empty") { S.canvas = "image"; syncSeg("canvas","image"); render(); showToast("Opened as the main image", false); }
      else showToast("Added as a layer", false);
    }
  }
  g.style.display = "none"; $("#drop").classList.remove("on");
  e.target.removeEventListener("pointermove", onMove);
  drag = null;
}

render();
</script>
</body>
</html>
