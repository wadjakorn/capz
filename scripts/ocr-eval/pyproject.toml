[project]
name = "ocr-eval"
version = "0.1.0"
description = "CP-0096 eval harness: OpenThai2.0-OCR-Text vs Tesseract vs Vision on synthetic screenshots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "pyclipper>=1.4.0",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
ocr-eval = "ocr_eval.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
