name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # Pre-create the draft release once so all matrix jobs upload into the
  # same release. tauri-action's "find-or-create by tag" is not atomic; when
  # matrix jobs race they each create their own draft (caused split v0.1.9
  # drafts). With releaseId pinned here, no race.
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            // Reuse an existing draft for this tag if one exists; otherwise create.
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            let release = releases.find(r => r.tag_name === tag && r.draft);
            if (!release) {
              const res = await github.rest.repos.createRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                tag_name: tag,
                name: `capz v${version}`,
                body: 'See assets below. macOS builds are signed with Developer ID and notarized by Apple. Auto-update will pick this up on the next interval (default 24h) or via Settings → Updates → Check now.',
                draft: true,
                prerelease: false,
              });
              release = res.data;
            }
            core.setOutput('release_id', release.id);

  build:
    needs: [create-release]
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # macOS notarization: Developer ID identity + App Store Connect API key.
      # tauri-bundler notarizes + staples the .app on its own when APPLE_API_KEY
      # (key id) / APPLE_API_ISSUER / APPLE_API_KEY_PATH are set, so they go to
      # $GITHUB_ENV only when enabled — a set-but-empty var would make it try
      # (and fail) to notarize. Tag builds refuse to ship un-notarized: the
      # cask, README and site promise a Gatekeeper-clean install.
      - name: Notarization setup (macOS)
        id: notary
        if: runner.os == 'macOS'
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ "${SIGN_IDENTITY:-}" == Developer\ ID\ Application* && -n "${API_KEY_P8:-}" && -n "${API_KEY_ID:-}" && -n "${API_ISSUER:-}" ]]; then
            KEY="$RUNNER_TEMP/AuthKey_capz.p8"
            printf '%s\n' "$API_KEY_P8" > "$KEY"
            {
              echo "APPLE_API_KEY=$API_KEY_ID"
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY_PATH=$KEY"
            } >> "$GITHUB_ENV"
            # Developer ID leaf certs chain through this intermediate; without
            # it the identity is "not valid" and codesign fails.
            curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
              https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            sudo security add-certificates -k /Library/Keychains/System.keychain \
              "$RUNNER_TEMP/DeveloperIDG2CA.cer" || true
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Tag build without notarization. Needs APPLE_SIGNING_IDENTITY = Developer ID Application + APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER secrets (docs/SIGNING.md)."
            exit 1
          else
            echo "::warning::Not notarizing (needs Developer ID identity + APPLE_API_KEY* secrets). macOS will block this build on first launch."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # On tag push: build, sign, upload to a draft GitHub Release, and
      # attach latest.json to the release (the update channel itself is
      # pointed at it only on publish — see publish-update-channel.yml).
      # On workflow_dispatch: tagName resolves to empty → build only,
      # no release side-effects.
      - name: Build + release via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID code signing (Hardened Runtime is Tauri's default).
          # A stable identity also keeps the Screen Recording (TCC) grant across
          # auto-updates. Notarization env (APPLE_API_*) comes from $GITHUB_ENV,
          # set by "Notarization setup" above. Windows ignores all of these.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      # tauri-bundler notarizes the .app (stapled inside the dmg and the
      # updater .app.tar.gz) but only signs the .dmg. Notarize + staple the dmg
      # too, then replace the release asset tauri-action already uploaded.
      # Stapling changes the dmg bytes: the cask sha256 is computed later, on
      # publish, from the release asset, so it matches.
      - name: Notarize .dmg (macOS)
        if: steps.notary.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [[ ${#DMGS[@]} -ne 1 ]]; then
            echo "::error::expected one .dmg, found ${#DMGS[@]}"
            exit 1
          fi
          xcrun stapler validate "src-tauri/target/${{ matrix.target }}/release/bundle/macos/capz.app"
          scripts/notarize.sh "${DMGS[0]}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release upload "$GITHUB_REF_NAME" "${DMGS[0]}" --clobber
          fi

      # Always upload build artifacts on non-tag dispatch so they are
      # downloadable from the workflow run for quick smoke-testing.
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: capz-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: ignore

  # The gh-pages update channel (latest.json) is published by
  # publish-update-channel.yml when the release is published, not here: a draft's
  # assets are not public, so pointing the channel at it offers a broken update.
